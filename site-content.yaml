works:
  - id: poiConfigTools
    tech: ["React", "TypeScript", "ECharts", "SVG", "SignalR"]
    highlight: true
    zh:
      name: "施耐德 · POI 中低压配电"
      description: "Power Operation Insight 核心配置工具，管理万点级中低压配电系统。主导性能治理与架构重构：配电树 72s→2.1s（34×）、页面跳转 14s→1.2s、OOM 归零；落地单线图 SVG 电流动画、DER 实时方向判定、POAE 看板 Vue→React 迁移，以及五层 AI 协作体系（团队人效 +70%）。"
    en:
      name: "Schneider · POI ConfigTools"
      description: "Core configuration tool for Power Operation Insight, handling 10k+ point low-voltage distribution systems. Led performance governance: tree build 72s to 2.1s (34x), page transition 14s to 1.2s, OOM eliminated. Delivered SVG current-flow animation, DER direction detection, a Vue-to-React dashboard migration, and a five-layer AI workflow (+70% team throughput)."
  - id: smartMeeting
    tech: ["Vue 3", "TypeScript", "ECharts", "多端适配"]
    highlight: true
    zh:
      name: "氪邦 · 智慧会议子系统"
      description: "企业级会议全流程管控：会议室资源池与状态屏协同、智能排期、会中控屏与议题汇报。独立开发待办督办、会议纪要、电子席卡等核心模块，抽离通用组件体系使团队效率提升 30%+，并适配大屏 / 中屏 / 小屏多硬件分辨率。"
    en:
      name: "Kebang · Smart Meeting Suite"
      description: "Enterprise meeting lifecycle platform: room resource pools, status screens, smart scheduling, in-meeting control. Built task tracking, minutes and electronic nameplates, extracted a shared component system lifting team efficiency by 30%+, and adapted across large / medium / small screens."
  - id: aerospaceLine
    tech: ["Three.js", "Vue 2", "WebSocket", "ECharts"]
    highlight: true
    zh:
      name: "联夯 · 首都航天机械产线"
      description: "B/S 架构自动化产线管控系统，配合机床与机器人实现全自动运行。从 0 到 1 搭建前端架构、封装 Axios / WebSocket 通信；用 Three.js 把物理产线 1:1 实时映射到浏览器（模型轻量化 + LOD + 帧率优化），并落地 SVG / ECharts 全流程可视化与自定义权限体系。"
    en:
      name: "Lianhang · Aerospace Production Line"
      description: "B/S production-line control system driving CNC machines and robots end to end. Built the frontend from scratch, wrapped Axios / WebSocket comms, mirrored the physical line 1:1 in the browser with Three.js (mesh decimation + LOD + frame tuning), and shipped SVG / ECharts dashboards with a custom permission model."
  - id: skillQaAgent
    tech: ["React", "TypeScript", "Vite", "Zustand", "sql.js"]
    link: "https://github.com/Jader-S/skill-qa-agent"
    highlight: true
    zh:
      name: "技能问答 Agent · Skill QA"
      description: "本地优先的学习与面试助手：把课程资料整理成知识点，按章节自测，再用同一份知识库做模拟面试。网页版数据全部落在浏览器（sql.js WASM + IndexedDB），未配置 API Key 时自动以 Mock 离线模式运行。"
    en:
      name: "Skill QA Agent"
      description: "A local-first study and interview assistant: turn course material into knowledge points, self-test by chapter, then run a mock interview on the same knowledge base. All browser data stays local (sql.js WASM + IndexedDB); without an API key it runs fully offline in Mock mode."

